# Гейт проекта в CI: линт SCSS, сборка и тесты.
# Ровно то же, что `npm run check` локально, — ничего сверх.
#
# Синтаксис площадки: https://gitverse.ru/docs/cicd/docs/workflow
# Каталог и формат:   https://gitverse.ru/docs/cicd/quick-start
name: Проверка

on:
  push:
    branches:
      - main
  # На GitVerse триггер pull_request поддержан частично: из типов работают
  # opened, edited, closed, reopened и synchronize. Нужны первый, второй
  # и последний — открытие ветки и каждый новый коммит в неё.
  pull_request:
    types:
      - opened
      - reopened
      - synchronize

jobs:
  check:
    name: npm run check
    runs-on: ubuntu-latest
    strategy:
      # Обе версии договариваются до конца: красная 22 не должна прятать
      # результат 24 и наоборот.
      fail-fast: false
      matrix:
        # Node 20 снят с поддержки 30.04.2026 и, сверх того, не умеет
        # glob-шаблоны в `node --test` — проверено на v20.20.2.
        # 22 — действующая LTS (до 30.04.2027), 24 — следующая (до 30.04.2028).
        node-version: ['22', '24']
    steps:
      - name: Клонируем репозиторий
        uses: actions/checkout@v4

      - name: Ставим Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Ставим зависимости
        run: npm ci

      - name: Гейт
        run: npm run check

  # Браузерные тесты вынесены из `npm run check` и из job выше намеренно.
  # Гейт ставит только зависимости через npm ci, а движкам нужна отдельная
  # загрузка в сотни мегабайт — держать её в каждой ветке матрицы Node
  # значило бы платить за неё дважды ради результата, который от версии
  # Node не зависит: тесты гоняют браузер, а Node здесь только запускает
  # раннер и отдаёт статику.
  #
  # Пересборки нет: packages/*/dist лежат в репозитории, и проверяется
  # ровно то, что уходит пользователю. Расхождение dist с src ловит
  # check-dist в job выше.
  browser:
    name: Браузерные тесты (${{ matrix.browser }})
    runs-on: ubuntu-latest
    strategy:
      # Как и с версиями Node: красный webkit не должен прятать результат
      # chromium. Смысл этих тестов — межбраузерная разница, и знать нужно
      # про каждый движок, а не про первый упавший.
      fail-fast: false
      matrix:
        # Движок на ветку, а не все три в одном прогоне: три машины
        # параллельно проходят по 120 тестов за время одной, и каждой
        # хватает одной загрузки браузера вместо трёх.
        browser: ['chromium', 'firefox', 'webkit']
    steps:
      - name: Клонируем репозиторий
        uses: actions/checkout@v4

      - name: Ставим Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Ставим зависимости
        run: npm ci

      # --with-deps тянет ещё и системные библиотеки движка: на чистом
      # ubuntu их нет, и webkit без них не стартует вовсе. Кэша браузеров
      # здесь нет намеренно — сначала нужно знать, что кэш площадки
      # работает на этих ключах; загрузка одного движка стоит минуты,
      # а молча протухший кэш стоил бы разбора красного гейта.
      - name: Ставим движок ${{ matrix.browser }}
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Прогон
        run: npm run test:browser -- --project=${{ matrix.browser }}
